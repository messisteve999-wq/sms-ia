
name: Build SMS IA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Compiler l'APK
        run: gradle --no-daemon --max-workers=1 assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-IA-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
